services:
  - type: web
    name: synapse-ai-teacher-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-pro
      - key: GEMINI_FLASH_MODEL
        value: gemini-2.5-flash
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: SIMLI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
